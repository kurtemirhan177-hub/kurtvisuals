<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurt Visuals — Interview</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#080808;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;}
nav{display:flex;justify-content:center;align-items:center;padding:1.4rem 3rem;border-bottom:0.5px solid rgba(255,255,255,0.06);}
.nav-links{display:flex;gap:2.5rem;}
.nav-links a{font-size:11px;letter-spacing:0.14em;color:rgba(255,255,255,0.5);text-decoration:none;text-transform:uppercase;transition:color .3s;}
.nav-links a:hover{color:#fff;}
.page-header{padding:5rem 3rem 3rem;text-align:center;}
.page-eyebrow{font-size:10px;letter-spacing:0.22em;color:rgba(255,255,255,0.3);text-transform:uppercase;margin-bottom:1rem;}
.page-title{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;font-weight:300;font-size:44px;letter-spacing:-0.02em;color:#fff;}

.showcase{padding:2rem 4rem 8rem;display:grid;grid-template-columns:1.5fr 1fr;gap:5rem;align-items:center;}
/* Zone media : format horizontal 16/9 */
.showcase-video{position:relative;width:100%;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#0d0d0d;border:0.5px solid rgba(255,255,255,0.15);}
.showcase-video iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;pointer-events:none;}
#sound-btn{position:absolute;bottom:14px;right:14px;z-index:5;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);border:0.5px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background 0.3s;}
#sound-btn:hover{background:rgba(0,0,0,0.6);}
.showcase-text{max-width:420px;}
.showcase-eyebrow{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;font-size:24px;font-weight:300;letter-spacing:-0.01em;color:#fff;text-transform:none;margin-bottom:1.5rem;}
.showcase-title{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;font-weight:300;font-size:28px;letter-spacing:-0.01em;color:rgba(255,255,255,0.9);line-height:1.3;margin-bottom:1.5rem;}
.showcase-body{font-size:14px;color:rgba(255,255,255,0.4);line-height:1.9;}
.studiava-label{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;font-weight:500;font-size:26px;letter-spacing:-0.01em;color:#fff;margin-top:1.5rem;}

footer{padding:1.5rem 3rem;border-top:0.5px solid rgba(255,255,255,0.05);display:flex;justify-content:space-between;}
.footer-text{font-size:10px;color:rgba(255,255,255,0.15);letter-spacing:0.1em;text-transform:uppercase;}

@media (max-width:768px){
  nav{padding:1rem 1.5rem;}
  .nav-links{gap:1.2rem;}
  .nav-links a{font-size:10px;letter-spacing:0.1em;}
  .page-header{padding:3rem 1.5rem 2rem;}
  .page-title{font-size:32px;}
  .showcase{grid-template-columns:1fr;gap:2.5rem;padding:1.5rem;text-align:center;}
  .showcase-text{margin:0 auto;order:1;margin-top:1.5rem;margin-bottom:1rem;}
  .showcase-video{order:2;}
  .showcase-title{font-size:22px;}
  .showcase-body{font-size:13px;}
  .studiava-label{font-size:20px;}
  footer{padding:1rem 1.5rem;flex-direction:column;gap:0.5rem;}
}
</style>
</head>
<body>

<nav>
  <div class="nav-links">
    <a href="index.html#travaux">Travaux</a>
    <a href="index.html#equipe">À propos</a>
    <a href="index.html#contact">Contact</a>
  </div>
</nav>

<div class="page-header">
  <p class="page-eyebrow">Nos travaux</p>
  <h1 class="page-title">Interview</h1>
</div>

<div class="showcase">
  <div class="showcase-video">
    <iframe id="interview-vid" src="https://player.vimeo.com/video/1225047387?badge=0&autopause=0&player_id=0&app_id=58479&autoplay=1&loop=1&muted=1&controls=0&playsinline=1"
      frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      title="interview"></iframe>
    <div id="mobile-play-btn" onclick="startVideo()" style="display:none;position:absolute;inset:0;align-items:center;justify-content:center;cursor:pointer;z-index:4;">
      <div style="width:56px;height:56px;border-radius:50%;border:0.5px solid rgba(255,255,255,0.4);background:rgba(0,0,0,0.3);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </div>
    </div>
    <button id="sound-btn" onclick="toggleSound()" aria-label="Activer le son">
      <svg id="icon-muted" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      </svg>
      <svg id="icon-unmuted" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
    </button>
  </div>
  <div class="showcase-text">
    <p class="studiava-label">Studiava IA</p>
  </div>
</div>

<footer>
  <span class="footer-text">© 2025 Kurt Visuals</span>
  <span class="footer-text">France</span>
</footer>

<script src="https://player.vimeo.com/api/player.js"></script>
<script>
var player = null;
var muted = true;
var isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

function initPlayer() {
  var iframe = document.getElementById('interview-vid');
  if (typeof Vimeo !== 'undefined' && iframe) {
    try {
      player = new Vimeo.Player(iframe);
      if (isMobile) {
        var btn = document.getElementById('mobile-play-btn');
        btn.style.display = 'flex';
      } else {
        player.setMuted(true);
        player.play().catch(function(){});
      }
    } catch(e) {}
  }
}

function startVideo() {
  if (player) {
    player.setMuted(true);
    player.play().then(function() {
      document.getElementById('mobile-play-btn').style.display = 'none';
    }).catch(function(){});
  }
}

window.addEventListener('load', function() {
  setTimeout(initPlayer, 500);
});

function toggleSound() {
  muted = !muted;
  if (player) { player.setMuted(muted).catch(function(){}); }
  document.getElementById('icon-muted').style.display = muted ? 'block' : 'none';
  document.getElementById('icon-unmuted').style.display = muted ? 'none' : 'block';
}
</script>

</body>
</html>
